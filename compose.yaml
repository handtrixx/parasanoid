# Paranoid server deployment (runs on the storage box).
#
#   * parasanoid-server — Rust server (JSON API + discovery loop)
#   * ui-rust           — Rust server-rendered UI (proxies /api -> the server)
#
# Clients are deployed per-target via docker/client.compose.yaml. They
# self-register with the server on startup; no static client list required.

services:
  parasanoid-server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: parasanoid/server:dev
    environment:
      PARASANOID_LISTEN: :8080
      PARASANOID_POLL_INTERVAL: "10"
      # Optional static fallback list (comma-separated) for air-gapped clients
      # that cannot self-register, e.g. http://host1:9100,http://host2:9100
      # PARASANOID_CLIENTS: ""
      RUST_LOG: info
    restart: unless-stopped

  ui-rust:
    build:
      context: ./ui-rust
      dockerfile: Dockerfile
    image: parasanoid/ui-rust:dev
    environment:
      # Where the UI proxies /api to (same compose network -> service name).
      PARASANOID_SERVER_URL: http://parasanoid-server:8080
      # Where the UI listens. The scratch SQLite DB lives under /data (a named
      # volume, so the cache survives restarts — it repopulates on start).
      PARASANOID_UI_LISTEN: :3100
      PARASANOID_DB_PATH: /data/data.db
    ports:
      - "3100:3100"
    volumes:
      - ui-rust-db:/data
    depends_on:
      - parasanoid-server
    restart: unless-stopped

volumes:
  ui-rust-db:
