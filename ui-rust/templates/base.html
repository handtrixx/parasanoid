<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head></head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}parasanoid{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
    {% block head %}{% endblock %}
  </head>
  <body class="pb-4">
    <nav class="navbar md:navbar-expand bg-1 fg-2 sticky-top border-bottom">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">
          🛡️ parasanoid
        </a>
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item"><a class="nav-link" href="/">Clients</a></li>
        </ul>
        <div class="d-flex align-items-center">
          <span class="badge badge-subtle theme-secondary">Rust UI</span>
        </div>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navDrawer" aria-controls="navDrawer" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navDrawer" aria-labelledby="navDrawerLabel">
          <div class="drawer-header">
            <h5 class="drawer-title" id="navDrawerLabel">parasanoid</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Clients</a></li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

    <main class="container mt-4">
      {% block content %}{% endblock %}
    </main>

    <script type="module" src="/assets/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
